# Builds the MiniShop app and runs the Detox login tests on an Android emulator.
# Uses the release configuration: JS is bundled into the APK, so no Metro server is needed.
name: E2E (Detox, Android)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detox-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      # Linux runners need KVM permission for a fast (hardware-accelerated) emulator
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Pre-install what android/build.gradle asks for, instead of relying on Gradle auto-download
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.31.6" > /dev/null

      - name: Install npm dependencies
        run: npm ci

      - name: Build app + test APK (Detox, release)
        run: npx detox build -c android.emu.release

      # Boots an emulator named Pixel_API_35 (matches avdName in .detoxrc.js) and runs the tests on it
      - name: Run Detox tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          avd-name: Pixel_API_35
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Each line runs separately. Before testing: no auto-rotate, close any system dialogs
          # (e.g. "System UI isn't responding" after a cold boot) that would steal window focus.
          # If tests fail, print which window had focus to make CI failures diagnosable from the log.
          script: |
            adb shell settings put system accelerometer_rotation 0
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS
            adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' || true
            npx detox test -c android.emu.release --take-screenshots failing --record-logs failing --record-videos failing || (echo "=== Window focus at failure ==="; adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp'; exit 1)

      - name: Upload Detox artifacts (screenshots, logs, videos of failures)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detox-artifacts
          path: artifacts/
          retention-days: 7
